name: NovaFlow desktop release

# Builds the NovaFlow desktop installers for one v<semver> tag and
# publishes them, with their update metadata and SHA256SUMS, as that tag's
# GitHub Release. The version without the prefix becomes the installer and
# application version; a version containing "-" is published as a prerelease.
# Upstream dsh-v* tags do not match the trigger. Packaging never publishes by
# itself (electron-builder always runs with --publish never); only the final
# job writes to the repository.
on:
  push:
    tags:
      - 'novaflow-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: v<semver> tag to release from the selected branch or tag. A missing tag is created after packaging succeeds.
        required: true
        type: string
      reuse_run_id:
        description: Optional run ID whose Windows and Apple Silicon artifacts match the existing release tag.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: novaflow-desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Validate tag and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Select the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="$INPUT_TAG"; else tag="$GITHUB_REF_NAME"; fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Releases run only from a pushed desktop version tag."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.reuse_run_id && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      # Fails before any installer is built when the tag is not a supported desktop version
      # or CHANGELOG.md has no "## <version>" section.
      - name: Read the version and check its changelog section
        id: release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(node apps/desktop/scripts/desktop-release-notes.mjs version "$TAG")"
          commit="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$commit" ]; then
              echo "::error::The existing release tag differs from the selected source commit."; exit 1
            fi
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n%s\n' "$TAG" "$release" >> "$GITHUB_OUTPUT"
          version="$(printf '%s\n' "$release" | sed -n 's/^version=//p')"
          node apps/desktop/scripts/desktop-release-notes.mjs notes --version "$version" \
            --changelog CHANGELOG.md --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package ${{ matrix.target }}
    if: ${{ !inputs.reuse_run_id }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2025
            command: package:win:x64:unsigned
            output: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          # NovaFlow supports macOS only on Apple Silicon.
          - target: mac-arm64
            runner: macos-15
            command: package:mac:arm64:unsigned
            output: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Packaging reads its release settings from these variables instead of
      # apps/desktop/.env.<platform>; none of them is secret.
      DSH_DESKTOP_PACKAGE_SETTINGS: environment
      DSH_DESKTOP_APP_ID: com.novaflow.desktop
      DSH_DESKTOP_LINUX_MAINTAINER: Prokint <Prokint@users.noreply.github.com>
      DSH_DESKTOP_LINUX_HOMEPAGE: https://github.com/Prokint/NovaFlow
      # Signing later (no secret is required today):
      # - macOS: add DSH_DESKTOP_MACOS_SIGNING_IDENTITY and DSH_DESKTOP_MACOS_TEAM_ID,
      #   CSC_LINK (a p12 file decoded from a base64 secret into $RUNNER_TEMP) with
      #   CSC_KEY_PASSWORD, and one notarization strategy such as APPLE_API_KEY (a .p8
      #   file decoded from a secret), APPLE_API_KEY_ID, and APPLE_API_ISSUER, all read
      #   from repository secrets; then use package:mac:<arch> without :unsigned and
      #   the signed artifacts directory. Signed macOS builds install updates in place.
      # - Windows: the signed path expects DSH_DESKTOP_WINDOWS_CER_FILE, _SIGNTOOL,
      #   _KEY_CONTAINER, and _TOKEN_PIN for a hardware token, which needs a
      #   self-hosted runner with the token attached.
    steps:
      - name: Enable Windows Developer Mode (symlink support)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      # Complete history: the release packing scripts read tags.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use runner-owned temporary storage
        shell: pwsh
        run: |
          "TMPDIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "NODE_COMPILE_CACHE=$env:RUNNER_TEMP/node-compile-cache" >> $env:GITHUB_ENV
          "npm_config_devdir=$env:RUNNER_TEMP/node-gyp" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # Native modules build with node-gyp, which needs Python.
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install (immutable)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1

      - name: Install on Windows (immutable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          exit 1

      - name: Package ${{ matrix.target }} ${{ env.VERSION }}
        if: runner.os != 'Windows'
        shell: bash
        run: pnpm --dir apps/desktop run "${{ matrix.command }}" --build-version "$VERSION"

      - name: Package Windows ${{ env.VERSION }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm --dir apps/desktop run "${{ matrix.command }}" --build-version "$env:VERSION"

      # Verifies latest*.yml against the installers on this runner before upload.
      - name: Collect release files
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          node apps/desktop/scripts/collect-release-assets.mjs --version "$VERSION"
          --output "dist/release-${{ matrix.target }}" "${{ matrix.output }}"

      - name: Collect Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          node apps/desktop/scripts/collect-release-assets.mjs --version "$env:VERSION"
          --output "dist/release-${{ matrix.target }}" "${{ matrix.output }}"

      - uses: actions/upload-artifact@v7
        with:
          name: novaflow-desktop-${{ matrix.target }}
          path: dist/release-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Keep packaging records after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: novaflow-desktop-${{ matrix.target }}-packaging-runs
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.package.result == 'success' || (inputs.reuse_run_id && needs.package.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-release

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # The collector parses update metadata with js-yaml; no build or install script is needed.
      - name: Install (immutable, without scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify reused artifacts belong to the release commit
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq .head_sha)" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq .path)" = '.github/workflows/novaflow-desktop-release.yml'

      - uses: actions/download-artifact@v8
        with:
          name: novaflow-desktop-win-x64
          path: dist/inputs/novaflow-desktop-win-x64
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v8
        with:
          name: novaflow-desktop-mac-arm64
          path: dist/inputs/novaflow-desktop-mac-arm64
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Package the tagged source
        shell: bash
        run: |
          mkdir -p dist/source
          git archive --format=zip --prefix="NovaFlow-$TAG/" --output="dist/source/novaflow-$VERSION-source.zip" HEAD

      # Verifies every update file
      # against the installers it names, and writes SHA256SUMS.
      - name: Collect release assets
        run: >-
          node apps/desktop/scripts/collect-release-assets.mjs --version "$VERSION"
          --output dist/release dist/inputs/novaflow-desktop-win-x64 dist/inputs/novaflow-desktop-mac-arm64 dist/source

      - name: Require source, EXE and Apple Silicon DMG installer
        shell: bash
        run: |
          set -euo pipefail
          for file in "novaflow-$VERSION-source.zip" "novaflow-$VERSION-win-x64-unsigned.exe" \
            "novaflow-$VERSION-mac-arm64-unsigned.dmg"; do
            test -s "dist/release/$file"
          done

      - name: Write release notes
        run: >-
          node apps/desktop/scripts/desktop-release-notes.mjs notes --version "$VERSION"
          --changelog CHANGELOG.md --output dist/release-notes.md

      - name: State supported desktop platforms
        run: |
          printf '\n\nSupported desktop platforms: Windows x64 and macOS Apple Silicon (arm64). Intel Macs are not supported.\n' >> dist/release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          existing_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$existing_draft" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file dist/release-notes.md
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -n "$existing_draft" ]; then
            echo '::error::The release is already public; refusing to overwrite it.'; exit 1
          else
            gh release create "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --draft \
              --title "$TAG" --notes-file dist/release-notes.md "${flags[@]}"
          fi
          latest=()
          if [ "$PRERELEASE" = false ]; then latest+=(--latest); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${latest[@]}"
