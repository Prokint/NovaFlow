<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>抖音评论采集</title>
  <link rel="stylesheet" href="./styles.css?v=0.9.21" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>抖音评论采集</h1>
        <span class="version" id="version">v—</span>
      </div>
      <div class="topbar-meta">
        <span id="outDir">输出目录加载中…</span>
      </div>
    </header>

    <main class="grid">
      <section class="card create-card">
        <div class="card-head">
          <h2>新建采集</h2>
          <span class="muted">公开评论 · 本机浏览器 · 数据不出本机</span>
        </div>

        <label class="field">
          <span>视频链接</span>
          <input id="url" type="text" spellcheck="false"
                 placeholder="粘贴链接或分享文案（多条用逗号/空格隔开）" />
        </label>

        <label class="field">
          <span>关键词搜索</span>
          <input id="keyword" type="text" spellcheck="false"
                 placeholder="输入关键词" />
        </label>

        <div class="field-row" id="keywordRow1" hidden>
          <label class="field">
            <span>视频条数（前 N 条）</span>
            <input id="videoCount" type="number" min="1" max="100" step="1" />
          </label>
          <label class="field">
            <span>排序依据</span>
            <select id="sortType">
              <option value="综合排序">综合排序</option>
              <option value="最新发布">最新发布</option>
              <option value="最多点赞">最多点赞</option>
            </select>
          </label>
          <label class="field">
            <span>发布时间</span>
            <select id="publishTime">
              <option value="不限">不限</option>
              <option value="一天内">一天内</option>
              <option value="一周内">一周内</option>
              <option value="半年内">半年内</option>
            </select>
          </label>
        </div>

        <div class="field-row" id="keywordRow2" hidden>
          <label class="field">
            <span>视频时长</span>
            <select id="duration">
              <option value="不限">不限</option>
              <option value="1分钟以下">1 分钟以下</option>
              <option value="1-5分钟">1-5 分钟</option>
              <option value="5分钟以上">5 分钟以上</option>
            </select>
          </label>
          <label class="field">
            <span>内容形式</span>
            <select id="contentType">
              <option value="不限">不限（视频搜索）</option>
              <option value="视频">视频</option>
              <option value="图文">图文（综合搜索里只留图文帖）</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>采集账号（shop-accounts）</span>
          <select id="account">
            <option value="">不指定（用本插件自己的登录态）</option>
          </select>
        </label>
        <p class="hint" id="accountHint" hidden></p>

        <div class="actions">
          <button id="start" class="btn primary" type="button"
                  title="开始后会在本机弹出浏览器，登录 / 扫码验证都在那个窗口里完成">开始采集</button>
          <button id="cancel" class="btn" type="button" disabled>取消</button>
        </div>
      </section>

      <section class="card status-card">
        <div class="card-head">
          <h2>采集状态</h2>
          <span id="badge" class="badge idle">空闲</span>
        </div>

        <div class="stats">
          <div class="stat"><span>已采（去重）</span><strong id="count">0</strong></div>
          <div class="stat"><span>落库</span><strong id="saved">0</strong></div>
          <div class="stat"><span>服务端 total</span><strong id="total">—</strong></div>
          <div class="stat"><span>已用</span><strong id="elapsed">0s</strong></div>
        </div>

        <div id="loginHint" class="login-hint hidden">
          <strong>需要登录 / 验证</strong>
          <span>切到本机浏览器窗口完成扫码或验证，完成后自动继续。</span>
        </div>

        <div class="progress" aria-hidden="true"><div id="bar"></div></div>
        <div id="statusLine" class="status-line">还没有开始采集。</div>

        <div class="log-head">
          <span>运行日志</span>
          <span class="muted" id="logCount"></span>
        </div>
        <pre id="log" class="log">—</pre>

        <div id="result" class="result hidden">
          <div class="card-head"><h3>本次结果</h3><span id="resultBadge" class="badge"></span></div>
          <div id="resultBody" class="result-body"></div>
        </div>
      </section>

      <section class="card exports-card">
        <div class="card-head">
          <h2>导出记录</h2>
          <button id="refreshExports" class="btn small" type="button">刷新</button>
        </div>
        <div id="exports" class="exports">加载中…</div>
      </section>

      <section class="card favorites-card">
        <div class="card-head">
          <div class="fav-title">
            <h2>收藏客户</h2>
            <span id="favCount" class="badge idle">0 位</span>
          </div>
          <div class="fav-head-actions">
            <button id="refreshFavs" class="btn small" type="button">刷新</button>
            <button id="exportFavs" class="btn small" type="button">导出 CSV</button>
          </div>
        </div>
        <div class="fav-toolbar">
          <input id="favSearch" class="fav-search" type="search" spellcheck="false"
                 placeholder="搜索昵称 / 抖音号 / 属地" />
          <select id="favRegion" class="fav-region" title="按属地筛选收藏客户">
            <option value="">全部属地</option>
          </select>
        </div>
        <div id="favs" class="fav-list">加载中…</div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="./app.js?v=0.9.21"></script>
</body>
</html>
