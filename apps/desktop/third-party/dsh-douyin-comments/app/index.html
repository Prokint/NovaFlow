<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>抖音评论采集</title>
  <link rel="stylesheet" href="./styles.css?v=0.8.6" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>抖音评论采集</h1>
        <span class="version" id="version">v—</span>
      </div>
      <div class="topbar-meta">
        <span id="outDir">输出目录加载中…</span>
      </div>
      <button id="btnTheme" class="btn ghost theme-btn" type="button" title="切换深色 / 浅色主题" aria-label="切换深色 / 浅色主题">
        <svg class="t-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.2v1.7M8 13.1v1.7M1.2 8h1.7M13.1 8h1.7M3.1 3.1l1.2 1.2M11.7 11.7l1.2 1.2M12.8 3.1l-1.2 1.2M4.3 11.7l-1.2 1.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <svg class="t-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.4 9.7a5.8 5.8 0 0 1-7.1-7.1 5.8 5.8 0 1 0 7.1 7.1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main class="grid">
      <section class="card create-card">
        <div class="card-head">
          <h2>新建采集</h2>
          <span class="muted">公开评论 · 本机浏览器 · 数据不出本机</span>
        </div>

        <label class="field">
          <span>视频链接</span>
          <input id="url" type="url" spellcheck="false"
                 placeholder="https://www.douyin.com/video/7660328050596371819" />
        </label>

        <label class="field">
          <span>采集账号（shop-accounts）</span>
          <select id="account">
            <option value="">不指定（用本插件自己的登录态）</option>
          </select>
        </label>
        <p class="hint" id="accountHint" hidden></p>

        <div class="field-row">
          <label class="field">
            <span>目标条数</span>
            <input id="max" type="number" min="1" max="1000000" step="1" />
          </label>
          <label class="field">
            <span>顶层路数</span>
            <select id="lanes">
              <option value="1">1 路（单路）</option>
              <option value="2">2 路</option>
              <option value="3">3 路（默认）</option>
              <option value="4">4 路</option>
              <option value="5">5 路</option>
              <option value="6">6 路</option>
              <option value="7">7 路</option>
              <option value="8">8 路</option>
            </select>
          </label>
          <label class="field">
            <span>总超时（分钟）</span>
            <input id="timeout" type="number" min="1" max="240" step="1" />
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span>等扫码（秒）</span>
            <input id="waitLogin" type="number" min="0" max="1800" step="10" />
          </label>
          <label class="check">
            <input id="replies" type="checkbox" checked />
            <span>补采二级回复</span>
          </label>
          <label class="check">
            <input id="clearBefore" type="checkbox" />
            <span>先清空旧数据</span>
          </label>
          <label class="check">
            <input id="cloud" type="checkbox" />
            <span>同时导出词云 HTML</span>
          </label>
        </div>

        <div class="actions">
          <button id="start" class="btn primary" type="button"
                  title="开始后会在本机弹出浏览器，登录 / 扫码验证都在那个窗口里完成">开始采集</button>
          <button id="cancel" class="btn" type="button" disabled>取消</button>
        </div>
      </section>

      <section class="card status-card">
        <div class="card-head">
          <h2>采集状态</h2>
          <span id="badge" class="badge idle">空闲</span>
        </div>

        <div class="stats">
          <div class="stat"><span>已采（去重）</span><strong id="count">0</strong></div>
          <div class="stat"><span>落库</span><strong id="saved">0</strong></div>
          <div class="stat"><span>服务端 total</span><strong id="total">—</strong></div>
          <div class="stat"><span>已用</span><strong id="elapsed">0s</strong></div>
        </div>

        <div id="loginHint" class="login-hint hidden">
          <strong>需要登录 / 验证</strong>
          <span>切到本机浏览器窗口完成扫码或验证，完成后自动继续。</span>
        </div>

        <div class="progress" aria-hidden="true"><div id="bar"></div></div>
        <div id="statusLine" class="status-line">还没有开始采集。</div>

        <div class="log-head">
          <span>运行日志</span>
          <span class="muted" id="logCount"></span>
        </div>
        <pre id="log" class="log">—</pre>

        <div id="result" class="result hidden">
          <div class="card-head"><h3>本次结果</h3><span id="resultBadge" class="badge"></span></div>
          <div id="resultBody" class="result-body"></div>
        </div>
      </section>

      <section class="card exports-card">
        <div class="card-head">
          <h2>导出记录</h2>
          <button id="refreshExports" class="btn small" type="button">刷新</button>
        </div>
        <div id="exports" class="exports">加载中…</div>
      </section>

      <section class="card favorites-card">
        <div class="card-head">
          <div class="fav-title">
            <h2>收藏客户</h2>
            <span id="favCount" class="badge idle">0 位</span>
          </div>
          <div class="fav-head-actions">
            <button id="refreshFavs" class="btn small" type="button">刷新</button>
            <button id="exportFavs" class="btn small" type="button">导出 CSV</button>
          </div>
        </div>
        <div class="fav-toolbar">
          <input id="favSearch" class="fav-search" type="search" spellcheck="false"
                 placeholder="搜索昵称 / 抖音号 / 属地" />
          <select id="favRegion" class="fav-region" title="按属地筛选收藏客户">
            <option value="">全部属地</option>
          </select>
        </div>
        <div id="favs" class="fav-list">加载中…</div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="./app.js?v=0.8.6"></script>
</body>
</html>
